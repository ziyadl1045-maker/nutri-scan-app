workflows:
  android-release:
    name: NutriScan Android Release
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      java: 21
      node: 20
      vars:
        GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        DATABASE_URL: "postgresql://placeholder:placeholder@localhost/placeholder"
        SESSION_SECRET: "placeholder_secret_for_build_only"
    scripts:
      - name: Install Node dependencies
        script: npm install --registry=https://registry.npmjs.org
      - name: Build web assets
        script: npx vite build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android bundle and APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - ziyadl1045@gmail.com
        notify:
          success: true
          failure: true

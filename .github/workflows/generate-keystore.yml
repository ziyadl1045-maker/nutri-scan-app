name: Generate Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      key_password:
        description: 'Mot de passe pour la clé (retiens-le !)'
        required: true
        default: 'NutriScan2024!'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore nutriscan-release.jks \
            -alias nutriscan \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.key_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=NutriScan, OU=App, O=NutriScan, L=Casablanca, S=Casablanca, C=MA"

      - name: Show Base64 (copy this as KEYSTORE_BASE64 secret)
        run: |
          echo "====== COPY THIS AS KEYSTORE_BASE64 SECRET ======"
          base64 nutriscan-release.jks
          echo "=================================================="

      - name: Upload Keystore file
        uses: actions/upload-artifact@v4
        with:
          name: nutriscan-release.jks
          path: nutriscan-release.jks
          retention-days: 1
